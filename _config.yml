title: blank
first_name: Heyi
middle_name:
last_name: Zheng
contact_note:
description: >
  A personal research website on urban economics, family economics, housing, and data.
footer_text: >
  A personal research website by Heyi Zheng.
keywords: economics, urban economics, family economics, housing, remote sensing
lang: en
icon:
url: https://heyizheng321.github.io
baseurl:
last_updated: false
impressum_path:
back_to_top: false

navbar_fixed: false
footer_fixed: false
search_enabled: false
socials_in_search: false
posts_in_search: false
bib_search: false
max_width: 930px
serve_og_meta: false
serve_schema_org: false
og_image:

blog_name: blog
blog_description: Occasional notes on research, data, and cities.
permalink: /blog/:year/:title/
lsi: false
pagination:
  enabled: false
related_blog_posts:
  enabled: false
  max_related: 5
newsletter:
  enabled: false
  endpoint:
giscus:
  repo:
  repo_id:
  category: Comments
  category_id:
  mapping: title
  strict: 1
  reactions_enabled: 1
  input_position: bottom
  dark_theme: light
  light_theme: light
  emit_metadata: 0
  lang: en
disqus_shortname:
external_sources: []

collections:
  books:
    output: true
  news:
    defaults:
      layout: post
    output: true
  projects:
    output: true
  teachings:
    output: true

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1
include: ["_pages", "_scripts"]
exclude:
  - bin/
  - vendor/
  - _pages/about_einstein.md
  - README.md
  - Gemfile
  - Gemfile.lock
keep_files:
  - CNAME
  - .nojekyll

plugins:
  - jekyll-3rd-party-libraries
  - jekyll-archives-v2
  - jekyll-cache-bust
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-imagemagick
  - jekyll-jupyter-notebook
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-socials
  - jekyll-tabs
  - jekyll-terser
  - jekyll-toc
  - jekyll-twitter-plugin
  - jemoji

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false
sass:
  style: compressed
jekyll-minifier:
  compress_javascript: false
  exclude: ["robots.txt", "assets/js/search/*.js"]
terser:
  compress:
    drop_console: true
jekyll-archives: {}
display_tags: []
display_categories: []
scholar:
  last_name: [Zheng]
  first_name: [Heyi]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_link: Details
  query: "@*"
  group_by: year
  group_order: descending
enable_publication_badges:
  altmetric: false
  dimensions: false
  google_scholar: false
  inspirehep: false
filtered_bibtex_keywords: []
max_author_limit: 3
more_authors_animation_delay: 10
enable_publication_thumbnails: false
external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:
imagemagick:
  enabled: false
  widths: [480, 800, 1400]
  input_directories: [assets/img/]
  input_formats: [".jpg", ".jpeg", ".png", ".tiff", ".gif"]
lazy_loading_images: true
enable_google_analytics: false
enable_cronitor_analytics: false
enable_pirsch_analytics: false
enable_openpanel_analytics: false
enable_google_verification: false
enable_bing_verification: false
enable_cookie_consent: false
enable_masonry: false
enable_math: false
enable_tooltips: false
enable_darkmode: false
enable_navbar_social: false
enable_project_categories: false
enable_medium_zoom: false
enable_progressbar: false
enable_video_embedding: false
third_party_libraries:
  download: false
  jquery:
    url:
      js: https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js
    integrity:
      js:
  mdb:
    url:
      css: https://cdn.jsdelivr.net/npm/mdbootstrap@4.20.0/css/mdb.min.css
      js: https://cdn.jsdelivr.net/npm/mdbootstrap@4.20.0/js/mdb.min.js
    integrity:
      css:
      js:
  google_fonts:
    url:
      fonts: https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Slab:100,300,400,500,700|Material+Icons&display=swap
